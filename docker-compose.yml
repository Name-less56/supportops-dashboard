services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops_dev_2026
    ports:
      - "55432:5432"
    volumes:
      - supportops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  supportops_pgdata:
